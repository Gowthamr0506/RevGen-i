# Validates the release notes portal and deploys it to GitHub Pages.
#
# One-time setup (GitHub does not enable Pages for you):
#   Repository > Settings > Pages > Build and deployment > Source: "GitHub Actions"
# See release-notes/README.md ("Publishing") for the full steps and the access/visibility notes.
#
# Change the deployment branch by editing `branches` below.
name: Release notes portal

on:
  push:
    branches: [main]
    paths:
      - 'release-notes/**'
      - '.github/workflows/release-notes.yml'
  pull_request:
    paths:
      - 'release-notes/**'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run; a deploy is never cancelled half-way.
concurrency:
  group: release-notes-${{ github.event_name == 'pull_request' && github.head_ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tooling has its own tests (no dependencies to install).
      - name: Test the release tooling
        run: node --test release-notes/tools/tests/rn.test.mjs

      # Fails the run on: missing images, broken links, invalid metadata, duplicate versions, wrong capitalisation.
      # Regenerates the release pages and releases.json, so the deployed site is always in sync with the data.
      - name: Generate release pages and validate
        run: node release-notes/tools/rn.mjs build

      # Copies only public files into release-notes/_site. Draft releases and source files are never included.
      - name: Stage the public site
        run: node release-notes/tools/rn.mjs stage --out release-notes/_site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: release-notes/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
